<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10 CORE 체크</title>
<style>
:root{
  --bg:#f6f4ef;
  --card:#ffffff;
  --ink:#1c1a17;
  --sub:#8a857c;
  --line:#e7e3da;
  --accent:#2f6b4f;
  --accent-soft:#e3efe8;
  --gold:#c9a45c;
  --danger:#b4544a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171512; --card:#211f1b; --ink:#f0ede6; --sub:#9a948a;
    --line:#35322c; --accent:#6fae8e; --accent-soft:#26332c; --gold:#d4b477; --danger:#d07a70;
  }
}
:root[data-theme="dark"]{
  --bg:#171512; --card:#211f1b; --ink:#f0ede6; --sub:#9a948a;
  --line:#35322c; --accent:#6fae8e; --accent-soft:#26332c; --gold:#d4b477; --danger:#d07a70;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  min-height:100vh; padding-bottom:40px;
}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px}
.logo em{font-style:normal;color:var(--accent)}
.gear{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--sub);font-size:13px;cursor:pointer}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthbar h2{font-size:18px;font-weight:700}
.nav{background:var(--card);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:16px;color:var(--ink);cursor:pointer}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--sub);margin-bottom:6px}
.dow span:first-child{color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{
  aspect-ratio:1/1.15; background:var(--card); border:1px solid var(--line); border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:14px;cursor:pointer;
}
.cell.empty{background:transparent;border:none;cursor:default}
.cell.today{border:2px solid var(--accent)}
.cell .pct{font-size:10px;font-weight:700;color:var(--accent)}
.cell .pct.full{color:var(--gold)}
.cell.sun .num{color:var(--danger)}
.ring{width:6px;height:6px;border-radius:50%;background:var(--line)}
.stats{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-around;text-align:center}
.streak{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.streak .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:9px}
.streak .top b{font-size:16px;color:var(--ink)}
.goalbar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:5px}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--sub)}
/* day view */
.view{display:none}
.view.on{display:block}
.back{background:none;border:none;color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;padding:4px 0;margin-bottom:8px}
.daytitle{font-size:22px;font-weight:800;margin-bottom:4px}
.pctbig{font-size:15px;color:var(--sub);margin-bottom:14px}
.pctbig b{color:var(--accent);font-size:20px}
.pctbig b.full{color:var(--gold)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:6px;transition:width .25s}
/* items */
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.item.done{background:var(--accent-soft);border-color:var(--accent)}
.irow{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;user-select:none}
.chkhit{
  /* 실제 탭 가능 영역을 시각적 박스보다 넉넉하게 넓혀서(패딩+음수 마진),
     레이아웃은 그대로 두면서 터치 인식률을 높인다. */
  padding:12px; margin:-12px; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; cursor:pointer;
}
.chk{
  width:26px;height:26px;border-radius:8px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;
  pointer-events:none;
}
.item.done .chk{background:var(--accent);border-color:var(--accent)}
.imain{flex:1;min-width:0}
.iname{font-size:15px}
.item.done .iname{font-weight:600}
.inote{font-size:12px;color:var(--gold);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iarrow{color:var(--sub);font-size:12px;flex-shrink:0;transition:transform .2s}
.item.open .iarrow{transform:rotate(90deg)}
.idetail{display:none;padding:0 14px 14px;border-top:1px dashed var(--line)}
.item.open .idetail{display:block}
.idetail label{display:block;font-size:12px;color:var(--sub);font-weight:600;margin:12px 0 5px}
.idetail input{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:14px;color:var(--ink);font-family:inherit;
}
.idetail textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:14px;color:var(--ink);font-family:inherit;resize:vertical;min-height:70px;
}
.idetail input:focus,.idetail textarea:focus{outline:none;border-color:var(--accent)}
.btnrow{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.notion{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.5}
.note{font-size:12px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.6}
.note a{color:var(--accent)}
/* settings */
.set-item{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.set-item span{width:22px;font-size:13px;color:var(--sub);text-align:right}
.set-item input{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;font-size:14px;color:var(--ink);font-family:inherit;
}
.set-item input:focus{outline:none;border-color:var(--accent)}
/* modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal-box{background:var(--card);border-radius:16px;padding:16px;max-width:400px;width:100%;max-height:88vh;overflow:auto}
.modal-box img{width:100%;border-radius:10px;display:block}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;
  font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.on{opacity:1}
</style>
</head>
<body>


<div class="wrap">

  <div class="view on" id="view-cal">
    <header>
      <div class="logo">10 <em>CORE</em></div>
      <button class="gear" onclick="openSettings()">항목 설정</button>
    </header>
    <div class="monthbar">
      <button class="nav" onclick="moveMonth(-1)">‹</button>
      <h2 id="month-title"></h2>
      <button class="nav" onclick="moveMonth(1)">›</button>
    </div>
    <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="grid"></div>
    <div class="streak" id="streak"></div>
    <div class="stats">
      <div><b id="st-days">0</b><span>이번 달 실천일</span></div>
      <div><b id="st-full">0</b><span>100% 달성일</span></div>
      <div><b id="st-avg">0%</b><span>평균 달성률</span></div>
    </div>
  </div>

  <div class="view" id="view-day">
    <button class="back" onclick="showCal()">‹ 달력으로</button>
    <div class="daytitle" id="day-title"></div>
    <div class="pctbig">오늘의 달성률 <b id="day-pct">0%</b><span id="day-streak" style="margin-left:10px;color:var(--gold);font-weight:700"></span></div>
    <div class="bar"><i id="day-bar"></i></div>
    <div id="items"></div>
    <div class="btnrow">
      <button class="btn primary" onclick="openCard()">🖼 인증 카드 만들기</button>
    </div>
    <div class="note">체크박스를 누르면 체크, 항목 이름을 누르면 메모를 쓸 수 있습니다<br>10개를 모두 체크하면 인증 카드가 자동으로 열립니다</div>
  </div>

  <div class="view" id="view-set">
    <button class="back" onclick="showCal()">‹ 달력으로</button>
    <div class="daytitle">10 CORE 항목 설정</div>
    <div class="pctbig">나의 10가지 실천 항목을 수정할 수 있습니다</div>
    <div id="set-list"></div>
    <div class="daytitle" style="font-size:16px;margin-top:22px;margin-bottom:8px">연속 기록(챌린지) 설정</div>
    <div class="set-item"><span>기준</span><select id="set-mode" style="flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;color:var(--ink);font-family:inherit">
      <option value="any">1개 이상 체크하면 인정 (기본)</option>
      <option value="full">10개 모두 체크한 날만 인정 (100%)</option>
    </select></div>
    <div class="set-item"><span>목표</span><input id="set-goal" type="number" min="1" max="999" inputmode="numeric"></div>
    <div class="daytitle" style="font-size:16px;margin-top:22px;margin-bottom:8px">데이터 백업 · 복원</div>
    <textarea id="bk" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;color:var(--ink);font-family:monospace;min-height:80px;resize:vertical" placeholder="[백업 코드 만들기]를 누르면 전체 기록이 코드로 만들어집니다.
다른 기기에서 복원하려면 그 코드를 여기에 붙여넣고 [복원하기]를 누르세요."></textarea>
    <div class="btnrow" style="margin-top:8px">
      <button class="btn ghost" onclick="makeBackup()">백업 코드 만들기</button>
      <button class="btn ghost" onclick="backupFile()">파일로 저장</button>
    </div>
    <div class="btnrow" style="margin-top:8px">
      <button class="btn ghost" onclick="document.getElementById('bk-file').click()">파일에서 불러오기</button>
      <button class="btn primary" onclick="restoreBackup()">복원하기</button>
    </div>
    <input type="file" id="bk-file" accept=".json,application/json,text/plain" style="display:none" onchange="loadBackupFile(this)">
    <div class="btnrow">
      <button class="btn primary" onclick="saveSettings()">저장하기</button>
    </div>
  </div>

</div>

<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="modal-box">
    <img id="preview-img" alt="10코어 인증 카드">
    <div class="btnrow">
      <button class="btn ghost" onclick="document.getElementById('modal').classList.remove('on')">닫기</button>
      <button class="btn primary" onclick="shareCard()">📤 사진 저장 / 공유</button>
    </div>
    <div class="note">버튼을 누르면 공유 창이 열립니다 → "이미지 저장"을 선택하세요<br>안 열리면 이미지를 길게 눌러 저장하거나, 링크를 사파리·크롬에서 열어보세요</div>
  </div>
</div>

<div class="modal" id="cfm" style="z-index:60">
  <div class="modal-box">
    <div style="font-size:15px;line-height:1.7" id="cfm-msg"></div>
    <div class="btnrow">
      <button class="btn ghost" onclick="cfmNo()">취소</button>
      <button class="btn primary" onclick="cfmYes()">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_ITEMS = [
  "운동","30분 독서","오디오 듣기","미팅 참석","제품 애용",
  "소비자 관리","STP","상담","신뢰쌓기","E-Com"
];
let state = { items: DEFAULT_ITEMS.slice(), days: {}, itemsV: 2, streakMode: "any", streakGoal: 66, modeV: 2 };
let cur = new Date();
let selKey = null;
let autoSaved = {};
let downloadsNS = null, dbNS = null;

// ---------- 저장/로드 ----------
function load(){
  try{
    const raw = localStorage.getItem("tencore-v1");
    if(raw){
      const d = JSON.parse(raw);
      if(d && d.itemsV===2 && Array.isArray(d.items) && d.items.length===10) state.items = d.items;
      if(d && d.modeV===2 && (d.streakMode==="any" || d.streakMode==="full")) state.streakMode = d.streakMode;
      if(d && d.streakGoal>0) state.streakGoal = d.streakGoal;
      if(d && d.days && typeof d.days==="object"){
        state.days = d.days;
        // v1 -> v2 마이그레이션
        for(const k in state.days){
          const dd = state.days[k];
          if(!Array.isArray(dd.n)) dd.n = ["","","","","","","","","",""];
          if(!Array.isArray(dd.t)) dd.t = ["","","","","","","","","",""];
          if(!Array.isArray(dd.c)) dd.c = [false,false,false,false,false,false,false,false,false,false];
        }
      }
    }
  }catch(e){}
}
function persist(){
  state.ts = Date.now();
  try{ localStorage.setItem("tencore-v1", JSON.stringify(state)); }catch(e){}
  cloudSave();
}
// 입력 중 디바운스로 예약된 저장이 있으면 지금 즉시 실행한다.
// 화면 전환/입력창에서 손 뗄 때/앱을 나갈 때처럼 상태를 확정해야 하는 순간에 호출한다.
function flushPersist(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; persist(); }
}
let cloudTimer;
function cloudSave(){
  if(!dbNS) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(async function(){
    try{ await dbNS.doc("tencore/state").set(state); }catch(e){}
  }, 400);
}
function normalizeState(d){
  const ns = {
    items: (Array.isArray(d.items) && d.items.length===10) ? d.items : DEFAULT_ITEMS.slice(),
    days: (d.days && typeof d.days==="object") ? d.days : {},
    itemsV: 2, modeV: 2,
    streakMode: (d.streakMode==="full" ? "full" : "any"),
    streakGoal: (d.streakGoal>0 ? d.streakGoal : 66),
    ts: d.ts || 0
  };
  for(const k in ns.days){
    const dd = ns.days[k];
    if(!Array.isArray(dd.c)) dd.c=[false,false,false,false,false,false,false,false,false,false];
    if(!Array.isArray(dd.n)) dd.n=["","","","","","","","","",""];
    if(!Array.isArray(dd.t)) dd.t=["","","","","","","","","",""];
  }
  return ns;
}
// 이 기기에 이미 로컬 기록이 있으면 절대 클라우드로 덮어쓰지 않는다(예전 클라우드
// 스냅샷이 방금 입력한 내용을 지워버리는 것을 방지). 로컬이 비어있는
// "새 기기"일 때만 클라우드에서 불러온다. 로컬이 있으면 최신 상태를 클라우드에 반영만 한다.
async function cloudLoad(){
  if(!dbNS) return;
  const localHasData = Object.keys(state.days||{}).length > 0;
  if(localHasData){
    cloudSave();
    return;
  }
  try{
    const snap = await dbNS.doc("tencore/state").get();
    if(snap.exists){
      const cloud = snap.data();
      if(cloud && cloud.days){
        state = normalizeState(cloud);
        try{ localStorage.setItem("tencore-v1", JSON.stringify(state)); }catch(e){}
        renderCal();
      }
    }
  }catch(e){}
}
function fixArr(a, fill){
  const out = new Array(10);
  for(let i=0;i<10;i++) out[i] = (Array.isArray(a) && a[i]!==undefined) ? a[i] : fill;
  return out;
}
function dayData(key){
  let d = state.days[key];
  if(!d) d = state.days[key] = { c:[], n:[], t:[] };
  // 예전 버전 데이터거나 일부 필드가 빠져 있어도(예: t 배열 누락) 항상 10칸을 보장한다.
  // 이게 없으면 날짜를 열 때 조용히 오류가 나서 화면 전환이 안 되는 것처럼 보인다.
  if(!Array.isArray(d.c) || d.c.length!==10) d.c = fixArr(d.c, false);
  if(!Array.isArray(d.n) || d.n.length!==10) d.n = fixArr(d.n, "");
  if(!Array.isArray(d.t) || d.t.length!==10) d.t = fixArr(d.t, "");
  return d;
}
function pctOf(key){
  const d = state.days[key];
  // 예전 형식이거나 손상된 기록이면 여기서 조용히 오류가 나서 체크/달력 전체가
  // 먹통이 되는 것처럼 보일 수 있다. 배열이 아니면 그냥 0%로 취급한다.
  if(!d || !Array.isArray(d.c)) return 0;
  return d.c.filter(Boolean).length * 10;
}
function keyOf(y,m,dd){ return y+"-"+String(m+1).padStart(2,"0")+"-"+String(dd).padStart(2,"0"); }
function parseKey(k){ const a=k.split("-").map(Number); return new Date(a[0],a[1]-1,a[2]); }
function qualifies(key){ const p=pctOf(key); return state.streakMode==="any" ? p>0 : p===100; }
function streakUpTo(key){
  let n=0, dt=parseKey(key);
  while(n<2000 && qualifies(keyOf(dt.getFullYear(),dt.getMonth(),dt.getDate()))){ n++; dt.setDate(dt.getDate()-1); }
  return n;
}
function currentStreak(){
  const t=new Date();
  const tk=keyOf(t.getFullYear(),t.getMonth(),t.getDate());
  if(qualifies(tk)) return streakUpTo(tk);
  const y=new Date(t); y.setDate(y.getDate()-1);
  return streakUpTo(keyOf(y.getFullYear(),y.getMonth(),y.getDate()));
}
function cycleOf(n){
  const goal = state.streakGoal||66;
  if(n<=0) return { goal:goal, day:0, lap:1, laps:0 };
  return { goal:goal, day:((n-1)%goal)+1, lap:Math.floor((n-1)/goal)+1, laps:Math.floor(n/goal) };
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ---------- 달력 ----------
function renderCal(){
  const y = cur.getFullYear(), m = cur.getMonth();
  document.getElementById("month-title").textContent = y+"년 "+(m+1)+"월";
  const first = new Date(y,m,1).getDay();
  const last = new Date(y,m+1,0).getDate();
  const today = new Date();
  const tKey = keyOf(today.getFullYear(), today.getMonth(), today.getDate());
  let html = "";
  for(let i=0;i<first;i++) html += '<div class="cell empty"></div>';
  let doneDays=0, fullDays=0, pctSum=0;
  for(let d=1;d<=last;d++){
    const k = keyOf(y,m,d);
    const p = pctOf(k);
    if(p>0){ doneDays++; pctSum+=p; if(p===100) fullDays++; }
    const isToday = (k===tKey);
    const dow = new Date(y,m,d).getDay();
    let inner = '<span class="num">'+d+'</span>';
    if(p===100) inner += '<span class="pct full">100%</span>';
    else if(p>0) inner += '<span class="pct">'+p+'%</span>';
    else inner += '<span class="ring"></span>';
    html += '<div class="cell'+(isToday?" today":"")+(dow===0?" sun":"")+'" onclick="openDay(\''+k+'\')">'+inner+'</div>';
  }
  document.getElementById("grid").innerHTML = html;
  document.getElementById("st-days").textContent = doneDays;
  document.getElementById("st-full").textContent = fullDays;
  document.getElementById("st-avg").textContent = (doneDays? Math.round(pctSum/doneDays):0)+"%";
  const cs = currentStreak();
  const cy = cycleOf(cs);
  const tk2 = keyOf(today.getFullYear(),today.getMonth(),today.getDate());
  const todayDone = qualifies(tk2);
  let right = cy.day+' / '+cy.goal+'일';
  if(cy.laps>0) right = '🏆 '+cy.laps+'바퀴 완주 · '+right;
  if(!todayDone) right += ' · 오늘 아직 미완료';
  let left = '🔥 연속 '+cs+'일째';
  if(cy.lap>1) left += ' ('+cy.lap+'바퀴째)';
  document.getElementById("streak").innerHTML =
    '<div class="top"><b>'+left+'</b><span>'+right+'</span></div>'
    +'<div class="goalbar"><i style="width:'+Math.min(100, cy.day/cy.goal*100)+'%"></i></div>';
}

// #items 컨테이너 자체는 다시 그려지지 않으므로(내용만 매번 교체됨) 여기에 한 번만
// 위임 리스너를 걸어두면 매번 새로 렌더링되는 체크박스/화살표에도 항상 반응한다.
// click과 touchend를 모두 듣고, 같은 탭에 대해 두 번 처리되지 않도록 막는다.
(function setupItemsDelegation(){
  let lastHandled = 0;
  function handle(e){
    const el = e.target.closest("[data-act]");
    if(!el) return;
    const now = Date.now();
    if(now - lastHandled < 350) return; // touchend와 뒤이은 click 중복 방지
    lastHandled = now;
    const i = parseInt(el.getAttribute("data-i"), 10);
    const act = el.getAttribute("data-act");
    if(act === "toggle") toggle(e, i);
    else if(act === "expand") expand(i);
  }
  const container = document.getElementById("items");
  container.addEventListener("click", handle, false);
  container.addEventListener("touchend", handle, false);
})();
function expand(i){
  try{
    flushPersist();
    openIdx = (openIdx===i? -1 : i);
    renderItems();
  }catch(e){
    console.error("expand 오류:", e);
    toast("문제가 발생했습니다: "+(e && e.message ? e.message : e));
  }
}
function toggle(ev,i){
  try{
    ev.stopPropagation();
    const d = dayData(selKey);
    d.c[i] = !d.c[i];
    persist();
    renderItems();
    const p = pctOf(selKey);
    if(p===100 && !autoSaved[selKey]){
      autoSaved[selKey] = true;
      toast("🎉 100% 달성! 인증 카드를 엽니다");
      setTimeout(openCard, 700);
    }
  }catch(e){
    // 체크가 반응 없는 것처럼 보이는 걸 막기 위해, 무슨 오류인지 바로 알려준다.
    console.error("toggle 오류:", e);
    toast("체크 중 문제가 발생했습니다: "+(e && e.message ? e.message : e));
  }
}
let saveTimer;
function setNote(i,v){
  const d = dayData(selKey);
  d.n[i] = v;
  clearTimeout(saveTimer); saveTimer = setTimeout(persist, 400);
}
function setDetail(i,v){

}
function updatePct(){
  const p = pctOf(selKey);
  const el = document.getElementById("day-pct");
  el.textContent = p+"%";
  el.className = p===100 ? "full" : "";
  document.getElementById("day-bar").style.width = p+"%";

}

function quoteOf(key){
  const dt = parseKey(key);
  const dayNum = Math.floor(dt.getTime()/86400000);
  return QUOTES[((dayNum % QUOTES.length)+QUOTES.length) % QUOTES.length];
}

function drawCard(){
  const W=1080, H=1350;
  const cv = document.createElement("canvas");
  cv.width=W; cv.height=H;
  const x = cv.getContext("2d");
  const d = dayData(selKey);
  const p = pctOf(selKey);
  const [yy,mm,dd] = selKey.split("-").map(Number);
  const dowName = ["일","월","화","수","목","금","토"][new Date(yy,mm-1,dd).getDay()];

  const g = x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#1d3a2c"); g.addColorStop(1,"#0f231a");
  x.fillStyle=g; x.fillRect(0,0,W,H);

  x.fillStyle="#c9a45c"; x.font="700 34px sans-serif";
  x.fillText("DAILY REPORT", 70, 100);
  x.fillStyle="#ffffff"; x.font="800 76px sans-serif";
  x.fillText("10 CORE", 70, 185);
  x.fillStyle="rgba(255,255,255,.75)"; x.font="500 40px sans-serif";
  x.fillText(yy+"년 "+mm+"월 "+dd+"일 ("+dowName+")", 70, 245);
  if(qualifies(selKey)){
    const cy = cycleOf(streakUpTo(selKey));
    let badge = "🔥 DAY "+cy.day+"  ·  "+cy.goal+"일 챌린지";
    if(cy.lap>1) badge += "  "+cy.lap+"바퀴째";
    if(cy.day===cy.goal) badge = "🏆 "+cy.goal+"일 완주!  ("+cy.lap+"바퀴 달성)";
    x.fillStyle="#c9a45c"; x.font="800 42px sans-serif";
    x.fillText(badge, 70, 308);
  }

  const cx=W-190, cy=175, r=95;
  x.lineWidth=16;
  x.strokeStyle="rgba(255,255,255,.15)";
  x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.stroke();
  if(p>0){
    x.strokeStyle = p===100 ? "#c9a45c" : "#7fc9a2";
    x.beginPath(); x.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*(p/100)); x.stroke();
  }
  x.fillStyle="#ffffff"; x.font="800 56px sans-serif"; x.textAlign="center";
  x.fillText(p+"%", cx, cy+20);
  x.textAlign="left";

  let ty=372;
  const rowH=86;
  state.items.forEach((name,i)=>{
    const done = d.c[i];
    const note = (d.n[i]||"").trim();
    x.fillStyle = done ? "#7fc9a2" : "rgba(255,255,255,.1)";
    roundRect(x, 70, ty-34, 44, 44, 12); x.fill();
    if(done){
      x.strokeStyle="#0f231a"; x.lineWidth=6; x.lineCap="round";
      x.beginPath(); x.moveTo(81,ty-12); x.lineTo(91,ty-2); x.lineTo(105,ty-24); x.stroke();
    }
    x.fillStyle = done ? "#ffffff" : "rgba(255,255,255,.4)";
    x.font=(done?"700":"400")+" 38px sans-serif";
    x.fillText(clip(x,name,500), 140, ty);
    if(note){
      x.fillStyle = "#c9a45c";
      x.font="400 30px sans-serif";
      x.textAlign="right";
      x.fillText(clip(x,note,330), W-70, ty);
      x.textAlign="left";
    }
    ty += rowH;
  });

  x.fillStyle="rgba(255,255,255,.55)"; x.font="500 28px sans-serif"; x.textAlign="center";
  x.fillText(clip(x, quoteOf(selKey), W-120), W/2, H-55);
  x.textAlign="left";

  return cv;
}
function roundRect(x,a,b,w,h,r){
  x.beginPath();
  x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r);
  x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath();
}
function clip(x,s,max){
  while(x.measureText(s).width>max && s.length>1) s=s.slice(0,-1);
  return s;
}

}

async function backupFile(){
  const txt = JSON.stringify(state);
  const fname = "10core_backup_"+(new Date().toISOString().slice(0,10))+".json";
  try{
    if(navigator.canShare && typeof File!=="undefined"){
      const file = new File([txt], fname, {type:"application/json"});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }

      if(code==="rate_limited"){ toast("잠시 후 다시 시도해 주세요"); return; }
    }
  }
  makeBackup();
}
function applyBackup(txt){
  let t = String(txt).trim();
  const i0 = t.indexOf("{"), j0 = t.lastIndexOf("}");
  if(i0 >= 0 && j0 > i0) t = t.slice(i0, j0+1);
  let d;
  try{ d = JSON.parse(t); }catch(e){ toast("백업 코드 형식이 올바르지 않습니다. 코드 전체가 붙여넣어졌는지 확인해 주세요"); return; }
  if(!d || typeof d!=="object" || !d.days || !Array.isArray(d.items) || d.items.length!==10){ toast("올바른 10 CORE 백업이 아닙니다"); return; }
  askConfirm("현재 기기의 기록을 백업 데이터로 교체합니다. 계속할까요?", function(){ doRestore(d); });
}
function doRestore(d){
  state = {
    items: d.items, days: d.days || {}, itemsV: 2, modeV: 2,
    streakMode: (d.streakMode==="full" ? "full" : "any"),
    streakGoal: (d.streakGoal>0 ? d.streakGoal : 66)
  };
  for(const k in state.days){
    const dd = state.days[k];
    if(!Array.isArray(dd.c)) dd.c=[false,false,false,false,false,false,false,false,false,false];
    if(!Array.isArray(dd.n)) dd.n=["","","","","","","","","",""];
    if(!Array.isArray(dd.t)) dd.t=["","","","","","","","","",""];
  }
  persist();
  toast("복원되었습니다 ✓");
  showCal();
}
function restoreBackup(){
  const txt = document.getElementById("bk").value.trim();
  if(!txt){ toast("먼저 백업 코드를 붙여넣어 주세요"); return; }
  applyBackup(txt);
}
function loadBackupFile(inp){
  const f = inp.files && inp.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = function(){ applyBackup(String(r.result||"")); };
  r.readAsText(f);
  inp.value = "";
}

// ---------- 앱 내 확인 창 ----------
let cfmCb = null;
function askConfirm(msg, cb){
  cfmCb = cb;
  document.getElementById("cfm-msg").textContent = msg;
  document.getElementById("cfm").classList.add("on");
}
function cfmYes(){
  document.getElementById("cfm").classList.remove("on");
  const f = cfmCb; cfmCb = null;
  if(f) f();
}
function cfmNo(){
  document.getElementById("cfm").classList.remove("on");
  cfmCb = null;
  toast("취소되었습니다");
}

// ---------- 토스트 ----------
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("on"), 3000);
}

load();
renderCal();
(async ()=>{
  try{
    if(window.claude && window.claude.use){
      const [dl, db] = await Promise.all([
        window.claude.use("downloads").catch(()=>null),
        window.claude.use("db").catch(()=>null)
      ]);
      downloadsNS = dl; dbNS = db;
    }
  }catch(e){}
  cloudLoad();
})();
